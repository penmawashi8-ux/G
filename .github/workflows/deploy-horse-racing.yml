name: Deploy Horse Racing Game to GitHub Pages

on:
  push:
    branches: [claude/horse-racing-board-game-q34hZ, main]
    paths:
      - 'horse-racing/**'
      - '.github/workflows/deploy-horse-racing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: horse-racing/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: horse-racing

      - name: Build
        run: npm run build
        working-directory: horse-racing

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: horse-racing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
